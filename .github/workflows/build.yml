                  @JavascriptInterface public void log(String id, String line) { OverlayService.log(id, line); }
                  @JavascriptInterface public void hide(String id) { OverlayService.hideBot(id); }
                  @JavascriptInterface public void hideAll() { stopService(new Intent(MainActivity.this, OverlayService.class)); }

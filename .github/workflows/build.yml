          EMB = ''
          UA = {'User-Agent': 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'}

          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25).read()

          class P(HTMLParser):
              def __init__(s):
                  super().__init__(); s.links = []
              def handle_starttag(s, t, a):
                  if t == 'link':
                      a = dict(a); rel = (a.get('rel') or '').lower()
                      if a.get('href') and ('icon' in rel or 'manifest' in rel):
                          s.links.append((rel, a['href']))

          cands = []
          if OVR:
              cands.append(OVR)
          elif not EMB:
              try:
                  p = P(); p.feed(get(APP).decode('utf-8', 'ignore'))
                  for rel, href in p.links:
                      u = urllib.parse.urljoin(APP, href)
                      if 'manifest' in rel:
                          try:
                              for i in json.loads(get(u)).get('icons', []):
                                  cands.append(urllib.parse.urljoin(u, i['src']))
                          except Exception as e:
                              print('manifest:', e)
                      else:
                          cands.append(u)
              except Exception as e:
                  print('page:', e)
              root = urllib.parse.urljoin(APP, '/')
              cands += [root + 'apple-touch-icon.png', root + 'icon-512.png', root + 'favicon.png', root + 'favicon.ico']

          best = None
          if EMB and not OVR:
              best = (Image.open(io.BytesIO(base64.b64decode(EMB))).convert('RGBA'), 'embedded icon')
          for u in cands:
              try:
                  im = Image.open(io.BytesIO(get(u))); im.load(); im = im.convert('RGBA')
                  print('candidate', u, im.size)
                  if best is None or im.width * im.height > best[0].width * best[0].height:
                      best = (im, u)
              except Exception as e:
                  print('skip', u, e)
          if not best:
              print('::warning::No icon found on the app link - keeping the default icon. Pass icon_url to set one.')
              sys.exit(0)
          src, url = best
          print('using icon', url, src.size)
          if src.width < 192:
              print('::warning::Icon is only %dpx wide, it will look soft. Pass a bigger icon_url.' % src.width)

          c = src.getpixel((1, 1))
          bg = (c[0], c[1], c[2]) if c[3] > 200 else (5, 9, 14)
          res = 'android/app/src/main/res'

          def trim(im):
              w, h = im.size
              mask = Image.new('L', (w, h), 0)
              mask.putdata([255 if (p[3] > 20 and min(p[0], p[1], p[2]) < 240) else 0 for p in im.getdata()])
              bb = mask.getbbox()
              if not bb: return im
              l, t, r, b = bb
              side = int(max(r - l, b - t) * 1.12)
              cx, cy = (l + r) // 2, (t + b) // 2
              return im.crop((cx - side // 2, cy - side // 2, cx - side // 2 + side, cy - side // 2 + side))

          src = trim(src)

          def square(im, size, scale, fill):
              canvas = Image.new('RGBA', (size, size), fill)
              r = im.copy(); r.thumbnail((int(size * scale),) * 2, Image.LANCZOS)
              canvas.alpha_composite(r, ((size - r.width) // 2, (size - r.height) // 2))
              return canvas

          for d, l, f in [('mdpi', 48, 108), ('hdpi', 72, 162), ('xhdpi', 96, 216), ('xxhdpi', 144, 324), ('xxxhdpi', 192, 432)]:
              dd = '%s/mipmap-%s' % (res, d)
              os.makedirs(dd, exist_ok=True)
              for old in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  p = '%s/%s.webp' % (dd, old)
                  if os.path.exists(p): os.remove(p)
              a = square(src, l, 1.0, bg + (255,))
              a.save(dd + '/ic_launcher.png')
              m = Image.new('L', (l, l), 0); ImageDraw.Draw(m).ellipse((0, 0, l - 1, l - 1), fill=255)
              rd = a.copy(); rd.putalpha(m); rd.save(dd + '/ic_launcher_round.png')
              square(src, f, 0.66, (0, 0, 0, 0)).save(dd + '/ic_launcher_foreground.png')

          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@color/te_icon_bg"/>\n'
                 '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          for n in ('ic_launcher', 'ic_launcher_round'):
              open('%s/mipmap-anydpi-v26/%s.xml' % (res, n), 'w').write(xml)
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/te_icon.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="te_icon_bg">#%02X%02X%02X</color></resources>\n' % bg)
          PY
      - name: Set app name
        run: |
          python3 - <<'PY'
          import os,re
          p='android/app/src/main/res/values/strings.xml'; s=open(p).read(); n=os.environ['APP_NAME']
          s=re.sub(r'(<string name="app_name">)[^<]*',lambda m:m.group(1)+n,s)
          s=re.sub(r'(<string name="title_activity_main">)[^<]*',lambda m:m.group(1)+n,s)
          open(p,'w').write(s)
          PY
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ROBO-EA-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

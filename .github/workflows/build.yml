          (function () {
            if (window.__teHook) return;
            window.__teHook = true;
            var waiting = null, cur = null, known = {}, pend = null, askedAt = 0;

            function clean(s) { return (s || '').replace(/\s+/g, ' ').trim(); }
            function slug(s) { return (s || 'ea').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ea'; }

            // Native bridge: direct interface first, Capacitor plugin as backup.
            function api() {
              var T = window.TEAndroid;
              if (T) return {
                perm: function () { return Promise.resolve(T.hasPermission()); },
                ask: function () { T.requestPermission(); },
                show: function (b) { T.show(b.id, b.name, b.image || ''); },
                status: function (id, on) { T.setStatus(id, on); },
                hide: function (id) { T.hide(id); },
                hideAll: function () { T.hideAll(); },
                log: function (id, line) { T.log(id, line); }
              };
              var f = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.FloatingBubble;
              if (f) return {
                perm: function () { return f.hasPermission().then(function (r) { return r.granted; }); },
                ask: function () { return f.requestPermission(); },
                show: function (b) { return f.show({ id: b.id, name: b.name, image: b.image || '', online: true, open: false }); },
                status: function (id, on) { return f.setStatus({ id: id, online: on }); },
                hide: function (id) { return f.hide({ id: id }); },
                hideAll: function () { return f.hide({}); },
                log: function (id, line) { return f.log({ id: id, line: line }); }
              };
              return null;
            }

            // Optional: window.TEOverlay = {name, image}, or data-ea-name / data-ea-image attributes.
            function eaName() {
              if (window.TEOverlay && window.TEOverlay.name) return window.TEOverlay.name;
              var n = document.querySelector('[data-ea-name]');
              if (n) return clean(n.textContent);
              var h = document.querySelector('h1,h2,h3');
              return h ? clean(h.textContent) : (document.title || 'EA');
            }
            function toData(im) {
              try {
                var c = document.createElement('canvas'); c.width = c.height = 256;
                var x = c.getContext('2d'), k = Math.max(256 / im.naturalWidth, 256 / im.naturalHeight);
                var w = im.naturalWidth * k, h = im.naturalHeight * k;
                x.drawImage(im, (256 - w) / 2, (256 - h) / 2, w, h);
                return c.toDataURL('image/jpeg', 0.85);
              } catch (e) { return ''; }
            }
            function eaImage() {
              if (window.TEOverlay && window.TEOverlay.image) return window.TEOverlay.image;
              var a = document.querySelector('[data-ea-image]');
              var best = a && a.tagName === 'IMG' ? a : null, score = -1;
              if (!best) [].forEach.call(document.images, function (im) {
                var r = im.getBoundingClientRect();
                if (im.naturalWidth <= 0 || r.width < 40 || r.height < 40) return;
                var vis = r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
                var ratio = r.width / r.height, square = ratio > 0.8 && ratio < 1.25;
                var sc = (vis ? 1e6 : 0) + (square && r.width <= 420 ? 5e5 : 0) + r.width * r.height * (square ? 1 : 0.1);
                if (sc > score) { score = sc; best = im; }
              });
              if (!best) return '';
              return /^https?:/.test(best.src) ? best.src : toData(best);
            }

            // ---- Trades & signals -> floating panel console
            var seen = {}, seenN = 0;
            var KEY = /\b(BUY|SELL|SIGNAL|TRADE|ENTRY|OPENED|CLOSED|PENDING|TP|SL|TAKE PROFIT|STOP LOSS|PROFIT|LOSS)\b/i;
            function pushLine(text) {
              var A = api(); text = clean(text);
              if (!A || !cur || !text || text.length > 200) return;
              var now = Date.now();
              if (seen[text] && now - seen[text] < 60000) return;      // ignore re-renders of the same line
              if (++seenN > 300) { seen = {}; seenN = 0; }
              seen[text] = now;
              A.log(cur, new Date().toTimeString().slice(0, 8) + ' ' + text);
            }
            function mirror(text) {
              if (KEY.test(text) && /\d/.test(text) && !/\[SYS\]|^ENGINE/i.test(text)) pushLine(text);
            }
            function scan(el, budget) {
              if (budget.n <= 0 || el.nodeType !== 1) return;
              var t = clean(el.innerText || el.textContent);
              if (!t) return;
              if (t.length <= 200) { if (KEY.test(t) && /\d/.test(t) && !/\[SYS\]|^ENGINE/i.test(t)) { budget.n--; pushLine(t); } return; }
              [].forEach.call(el.children, function (c) { scan(c, budget); });
            }
            function part(v, label) { return v === undefined || v === null || v === '' ? '' : (label ? label + ' ' : '') + v; }
            function sendTag(tag, text) { pushLine('[' + tag + '] ' + text); }

            function begin(bot) {
              var A = api(); if (!A) return;
              A.perm().then(function (ok) {
                if (ok) { waiting = null; if (cur && cur !== bot.id) { A.hide(cur); delete known[cur]; } cur = bot.id; known[bot.id] = 1; A.show(bot); }
                else {
                  waiting = bot;
                  if (Date.now() - askedAt > 3000) { askedAt = Date.now(); A.ask(); }  // opens "Display over other apps"
                }
              });
            }
            function retry() { if (waiting) begin(waiting); }
            window.addEventListener('focus', retry);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) retry(); });

            function stopBot(id, all) {
              clearTimeout(pend); waiting = null;
              var A = api(); if (!A) return;
              if (all || !id) { A.hideAll(); known = {}; cur = null; return; }   // bubble disappears
              A.hide(id); delete known[id]; if (cur === id) cur = null;
            }
            function remove() { stopBot(null, true); }

            // 1) Button taps (capture phase = before the app's own handler, so labels still read START/STOP)
            document.addEventListener('click', function (e) {
              var el = e.target, i = 0, t;
              while (el && el !== document.body && i < 5) {
                t = clean(el.innerText).toUpperCase();
                if (/^[^A-Z0-9]*(START|START EA)[^A-Z0-9]*$/.test(t)) {
                  var n = eaName(), bot = { id: slug(n), name: n, image: eaImage() };
                  clearTimeout(pend);
                  pend = setTimeout(function () { begin(bot); }, 400);   // the "... STARTED" toast below gives the real name
                  return;
                }
                if (/^[^A-Z0-9]*(STOP|STOP EA)[^A-Z0-9]*$/.test(t)) return stopBot(null, true);
                if (/^[^A-Z0-9]*REMOVE[^A-Z0-9]*$/.test(t)) return remove();
                el = el.parentElement; i++;
              }
            }, true);

            // 2) Toast like "COTEX SNIPER EA STARTED" -> real EA name, show the bubble
            new MutationObserver(function (ms) {
              var budget = { n: 5 };
              ms.forEach(function (m) {
                if (m.type === 'characterData') { if (m.target.parentElement) scan(m.target.parentElement, budget); return; }
                [].forEach.call(m.addedNodes, function (n) {
                  if (n.nodeType !== 1) return;
                  scan(n, budget);
                  [n].concat([].slice.call(n.querySelectorAll('*'))).forEach(function (el) {
                    if (el.children.length) return;
                    var mm = /^(.{2,40}?)\s+(STARTED|STOPPED)$/i.exec(clean(el.textContent));
                    if (!mm || /^(\[SYS\]|>|ENGINE)/i.test(mm[1])) return;
                    var name = clean(mm[1]), id = slug(name);
                    if (/started/i.test(mm[2])) { clearTimeout(pend); begin({ id: id, name: name, image: eaImage() }); }
                    else stopBot(known[id] ? id : cur);
                  });
                });
              });
            }).observe(document.body, { childList: true, subtree: true, characterData: true });

            // 3) Safety net: re-read the page every 3s so signals/trades that update in place still reach the panel
            setInterval(function () { if (cur) scan(document.body, { n: 6 }); }, 3000);

            // Optional explicit API for the web app
            window.TEOverlay = window.TEOverlay || {};
            window.TEOverlay.start = function (o) { o = o || {}; var n = o.name || eaName(); begin({ id: slug(n), name: n, image: o.image || eaImage() }); };
            window.TEOverlay.stop = function () { stopBot(cur); };
            window.TEOverlay.remove = remove;
            window.TEOverlay.log = function (text) { pushLine(String(text)); };
            window.TEOverlay.signal = function (o) {
              if (typeof o === 'string') return sendTag('SIGNAL', o);
              sendTag('SIGNAL', [o.side, o.symbol, part(o.price, '@'), part(o.sl, 'SL'), part(o.tp, 'TP')].filter(Boolean).join(' '));
            };
            window.TEOverlay.trade = function (o) {
              if (typeof o === 'string') return sendTag('TRADE', o);
              sendTag('TRADE', [o.action, o.side, o.symbol, part(o.lots, '') && o.lots + ' lots', part(o.price, '@'), part(o.profit, 'P/L')].filter(Boolean).join(' '));
            };
          })();
          EOF

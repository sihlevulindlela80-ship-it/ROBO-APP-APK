name: Build ROBO EA APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your app link"
        required: true
        default: "https://tradeexpertea.com/ea-app"
      app_name:
        description: "App name"
        required: true
        default: "ROBO EA"
      icon_url:
        description: "Icon image link (optional - leave empty to use the icon of your app link)"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}
      APP_NAME: ${{ inputs.app_name }}
      ICON_URL: ${{ inputs.icon_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create app from link
        working-directory: .
        run: |
          mkdir -p app/www
          cd app
          echo '<!doctype html><title>TradeExpert</title>' > www/index.html
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.tradeexpert.app',appName:process.env.APP_NAME,webDir:'www',server:{url:process.env.APP_URL,cleartext:false}},null,2))"
          npx cap add android
      - name: Install floating overlay
        run: |
          PKG=$(grep -ohP "appId[\"']?\s*:\s*[\"']\K[^\"']+" capacitor.config.* | head -1)
          [ -z "$PKG" ] && { echo "appId not found"; exit 1; }
          DIR="android/app/src/main/java/$(echo $PKG | tr . /)"
          mkdir -p "$DIR" android/app/src/main/res/drawable android/app/src/main/assets
          cat > "$DIR/FloatingBubblePlugin.java" <<'EOF'
          package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FloatingBubble")
          public class FloatingBubblePlugin extends Plugin {

              @Override
              public void load() {
                  OverlayService.listener = new OverlayService.Listener() {
                      @Override public void onAction(String id, String action) {
                          JSObject o = new JSObject();
                          o.put("id", id);
                          o.put("action", action);
                          notifyListeners("overlayAction", o);
                      }
                  };
              }

              @PluginMethod
              public void hasPermission(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  Context c = getContext();
                  if (!Settings.canDrawOverlays(c)) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + c.getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                  }
                  call.resolve();
              }

              /** Add / update one EA (bot) and open its panel. Call once per EA you start. */
              @PluginMethod
              public void show(PluginCall call) {
                  Context c = getContext();
                  if (!Settings.canDrawOverlays(c)) { call.reject("overlay permission not granted"); return; }
                  Intent i = new Intent(c, OverlayService.class);
                  i.putExtra("op", "show");
                  i.putExtra("id", call.getString("id", "default"));
                  i.putExtra("name", call.getString("name", ""));
                  i.putExtra("image", call.getString("image", ""));
                  i.putExtra("title", call.getString("title", ""));
                  i.putExtra("online", call.getBoolean("online", true));
                  i.putExtra("open", call.getBoolean("open", false));
                  if (call.hasOption("size")) i.putExtra("size", call.getFloat("size", 90f));
                  ContextCompat.startForegroundService(c, i);
                  call.resolve();
              }

              @PluginMethod
              public void setSize(PluginCall call) {
                  Context c = getContext();
                  Intent i = new Intent(c, OverlayService.class);
                  i.putExtra("size", call.getFloat("size", 90f));
                  ContextCompat.startForegroundService(c, i);
                  call.resolve();
              }

              @PluginMethod
              public void setStatus(PluginCall call) {
                  OverlayService.setStatus(call.getString("id", "default"), call.getBoolean("online", true));
                  call.resolve();
              }

              @PluginMethod
              public void log(PluginCall call) {
                  OverlayService.log(call.getString("id", "default"), call.getString("line", ""));
                  call.resolve();
              }

              /** hide({id}) removes one EA; hide() removes everything. */
              @PluginMethod
              public void hide(PluginCall call) {
                  if (call.hasOption("id")) OverlayService.hideBot(call.getString("id"));
                  else getContext().stopService(new Intent(getContext(), OverlayService.class));
                  call.resolve();
              }
          }
          EOF
          cat > "$DIR/OverlayService.java" <<'EOF'
          package __PKG__;

          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.*;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import org.json.JSONObject;

          public class OverlayService extends Service {
              public interface Listener { void onAction(String id, String action); }
              public static Listener listener;
              private static OverlayService instance;

              private static final String CH = "tradeexpert_overlay", LABEL = "Powered by ROBO EA";
              private static final float MIN_DP = 36f, MAX_DP = 220f;

              private static class Bot {
                  String id, name = "", image = ""; boolean online = true;
                  LinearLayout root; FrameLayout bubble; ImageView avatar; TextView label; View dot;
                  WindowManager.LayoutParams lp;
              }

              private final Handler main = new Handler(Looper.getMainLooper());
              private final LinkedHashMap<String, Bot> bots = new LinkedHashMap<>();
              private WindowManager wm;
              private SharedPreferences sp;
              private ScaleGestureDetector scaler;
              private boolean expanded = false;
              private String openId = null;
              private float sizeDp = 60f;

              private WebView web; private WindowManager.LayoutParams plp;
              private float panelFrac = 0.8f;
              private boolean ready = false;
              private final ArrayList<String> pending = new ArrayList<>();

              // ------------------------------------------------------------ static API
              private static String q(String s) { return JSONObject.quote(s == null ? "" : s); }
              public static void push(String js) { OverlayService s = instance; if (s != null) s.runJs(js); }
              public static void log(String id, String line) { push("window.cotex&&cotex.log(" + q(id) + "," + q(line) + ")"); }
              public static void setStatus(final String id, final boolean on) {
                  final OverlayService s = instance; if (s == null) return;
                  s.main.post(new Runnable() { public void run() {
                      Bot b = s.bots.get(id); if (b != null) { b.online = on; s.paintDot(b); }
                      s.runJs("window.cotex&&cotex.setStatus(" + q(id) + "," + on + ")");
                  }});
              }
              public static void hideBot(final String id) {
                  final OverlayService s = instance; if (s == null) return;
                  s.main.post(new Runnable() { public void run() { s.removeBot(id); } });
              }

              // -------------------------------------------------------------- lifecycle
              @Override public IBinder onBind(Intent i) { return null; }
              private android.os.PowerManager.WakeLock wl;
              static boolean running() { return instance != null; }
              @Override public void onCreate() {
                  super.onCreate(); instance = this;
                  try {
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(POWER_SERVICE);
                      wl = pm.newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK, "roboea:bot");
                      wl.setReferenceCounted(false); wl.acquire();
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent i, int flags, int startId) {
                  startAsForeground();
                  ensureInit();
                  if (i == null) { if (bots.isEmpty()) stopSelf(); return START_NOT_STICKY; }
                  if (i.hasExtra("size")) {
                      sizeDp = clamp(i.getFloatExtra("size", sizeDp));
                      sp.edit().putFloat("size", sizeDp).apply();
                      for (Bot b : bots.values()) applyBubbleSize(b);
                  }
                  if ("show".equals(i.getStringExtra("op"))) {
                      showBot(i.getStringExtra("id"), i.getStringExtra("name"), i.getStringExtra("image"),
                              i.getBooleanExtra("online", true), i.getStringExtra("title"), i.getBooleanExtra("open", false));
                  } else if (bots.isEmpty()) stopSelf();
                  return START_NOT_STICKY;
              }

              private void ensureInit() {
                  if (wm != null) return;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  sp = getSharedPreferences("tradeexpert_overlay", MODE_PRIVATE);
                  sizeDp = sp.getFloat("size", 60f);
                  panelFrac = sp.getFloat("panel3", 0.8f);
                  scaler = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override public boolean onScale(ScaleGestureDetector d) {
                          if (expanded && web != null) {
                              panelFrac = Math.max(0.5f, Math.min(0.95f, panelFrac * d.getScaleFactor()));
                              sizePanel(false);
                              if (web.isAttachedToWindow()) wm.updateViewLayout(web, plp);
                          } else {
                              sizeDp = clamp(sizeDp * d.getScaleFactor());
                              for (Bot b : bots.values()) applyBubbleSize(b);
                          }
                          return true;
                      }
                      @Override public void onScaleEnd(ScaleGestureDetector d) {
                          sp.edit().putFloat("size", sizeDp).putFloat("panel3", panelFrac).apply();
                      }
                  });
              }

              private void startAsForeground() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Floating overlay", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, CH);
                  } else b = new Notification.Builder(this);
                  Notification n = b.setContentTitle("ROBO EA running").setContentText("Bot is trading in the background")
                          .setSmallIcon(getApplicationInfo().icon).setOngoing(true).build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(1, n);
              }

              // ------------------------------------------------------------------- bots
              private void showBot(String id, String name, String image, boolean online, String title, boolean open) {
                  if (id == null || id.isEmpty()) id = "default";
                  Bot b = bots.get(id);
                  if (b == null) { b = new Bot(); b.id = id; bots.put(id, b); buildBubble(b); }
                  b.name = name == null ? "" : name;
                  b.online = online;
                  paintDot(b);
                  String img = image == null ? "" : image;
                  if (!img.equals(b.image) || b.avatar.getDrawable() == null) { b.image = img; loadImage(b); }
                  if (web == null) buildPanel();
                  runJs("window.cotex&&cotex.open(" + q(b.id) + "," + q(b.name) + "," + q(b.image) + "," + b.online + "," + q(title) + ")");
                  if (open) openPanel(b, title);
                  else if (!expanded && !b.root.isAttachedToWindow()) wm.addView(b.root, b.lp);
              }

              private void removeBot(String id) {
                  Bot b = bots.remove(id);
                  if (b == null) return;
                  if (b.root.isAttachedToWindow()) wm.removeView(b.root);
                  runJs("window.cotex&&cotex.remove(" + q(id) + ")");
                  if (bots.isEmpty()) { stopSelf(); return; }
                  if (expanded && id.equals(openId)) collapse();
              }

              private void loadImage(final Bot b) {
                  final String img = b.image;
                  if (b.avatar.getDrawable() == null) {
                      int def = getResources().getIdentifier("bot_avatar", "drawable", getPackageName());
                      if (def != 0) b.avatar.setImageBitmap(circle(BitmapFactory.decodeResource(getResources(), def)));
                  }
                  if (img == null || img.isEmpty()) return;
                  new Thread(new Runnable() { public void run() {
                      Bitmap bmp = null;
                      try {
                          if (img.startsWith("data:")) {
                              byte[] d = Base64.decode(img.substring(img.indexOf(',') + 1), Base64.DEFAULT);
                              bmp = BitmapFactory.decodeByteArray(d, 0, d.length);
                          } else if (img.startsWith("http")) {
                              HttpURLConnection c = (HttpURLConnection) new URL(img).openConnection();
                              c.setConnectTimeout(8000); c.setReadTimeout(8000);
                              InputStream in = c.getInputStream();
                              bmp = BitmapFactory.decodeStream(in);
                              in.close();
                          }
                      } catch (Exception ignored) {}
                      final Bitmap fin = circle(bmp);
                      if (fin == null) return;
                      main.post(new Runnable() { public void run() {
                          if (img.equals(b.image)) b.avatar.setImageBitmap(fin);
                      }});
                  }}).start();
              }

              private Bitmap circle(Bitmap src) {
                  if (src == null) return null;
                  int s = 256, side = Math.min(src.getWidth(), src.getHeight());
                  Bitmap sq = Bitmap.createBitmap(src, (src.getWidth() - side) / 2, (src.getHeight() - side) / 2, side, side);
                  Bitmap sc = Bitmap.createScaledBitmap(sq, s, s, true);
                  Bitmap out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(out);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setShader(new BitmapShader(sc, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
                  cv.drawCircle(s / 2f, s / 2f, s / 2f - 8, p);
                  Paint r = new Paint(Paint.ANTI_ALIAS_FLAG);
                  r.setStyle(Paint.Style.STROKE); r.setStrokeWidth(8); r.setColor(0xFF39414D);
                  cv.drawCircle(s / 2f, s / 2f, s / 2f - 4, r);
                  return out;
              }

              private void paintDot(Bot b) {
                  if (b == null || b.dot == null) return;
                  ((GradientDrawable) b.dot.getBackground()).setColor(b.online ? 0xFF3DDC97 : 0xFF6B7380);
              }

              // ------------------------------------------------------------------ panel
              private void buildPanel() {
                  web = new WebView(this);
                  web.setBackgroundColor(Color.TRANSPARENT);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String url) {
                          ready = true;
                          for (String js : pending) v.evaluateJavascript(js, null);
                          pending.clear();
                      }
                  });

                  plp = new WindowManager.LayoutParams(-2, -2, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  plp.gravity = Gravity.TOP | Gravity.START;
                  plp.x = sp.getInt("px", -1);
                  plp.y = sp.getInt("py", getResources().getDisplayMetrics().heightPixels / 5);
                  sizePanel(plp.x < 0);

                  web.setOnTouchListener(new View.OnTouchListener() {
                      boolean dragging; float tx, ty; int sx, sy;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          scaler.onTouchEvent(e);
                          float unit = plp.width / 320f;
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  dragging = e.getY() < 58 * unit && e.getX() < plp.width - 52 * unit;
                                  if (dragging) { sx = plp.x; sy = plp.y; tx = e.getRawX(); ty = e.getRawY(); }
                                  return dragging;
                              case MotionEvent.ACTION_MOVE:
                                  if (dragging && e.getPointerCount() == 1 && !scaler.isInProgress()) {
                                      plp.x = sx + (int) (e.getRawX() - tx);
                                      plp.y = sy + (int) (e.getRawY() - ty);
                                      wm.updateViewLayout(web, plp);
                                  }
                                  return dragging;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  if (dragging) {
                                      dragging = false;
                                      sp.edit().putInt("px", plp.x).putInt("py", plp.y).apply();
                                      return true;
                                  }
                                  return false;
                          }
                          return false;
                      }
                  });
                  web.loadUrl("file:///android_asset/overlay.html");
              }

              private void sizePanel(boolean center) {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int w = Math.round(dm.widthPixels * panelFrac), h = Math.round(w * 246f / 320f);
                  if (h > dm.heightPixels * 0.9f) { h = Math.round(dm.heightPixels * 0.9f); w = Math.round(h * 320f / 246f); }
                  plp.width = w; plp.height = h;
                  if (center) plp.x = (dm.widthPixels - w) / 2;
                  plp.x = Math.max(0, Math.min(plp.x, dm.widthPixels - w));
                  plp.y = Math.max(0, Math.min(plp.y, dm.heightPixels - h));
              }

              private void openPanel(Bot b, String title) {
                  for (Bot x : bots.values()) if (x.root.isAttachedToWindow()) wm.removeView(x.root);
                  openId = b.id;
                  runJs("window.cotex&&cotex.open(" + q(b.id) + "," + q(b.name) + "," + q(b.image) + "," + b.online + "," + q(title) + ")");
                  sizePanel(false);
                  if (!web.isAttachedToWindow()) wm.addView(web, plp);
                  expanded = true;
              }

              private void collapse() {
                  if (web != null && web.isAttachedToWindow()) wm.removeView(web);
                  expanded = false;
                  for (Bot b : bots.values()) {
                      applyBubbleSize(b);
                      if (!b.root.isAttachedToWindow()) wm.addView(b.root, b.lp);
                  }
              }

              private class Bridge {
                  @JavascriptInterface public void collapse() { main.post(new Runnable() { public void run() { OverlayService.this.collapse(); } }); }
                  @JavascriptInterface public void action(final String id, final String a) {
                      main.post(new Runnable() { public void run() {
                          Bot b = bots.get(id);
                          if (b != null) { if ("start".equals(a)) b.online = true; if ("stop".equals(a)) b.online = false; paintDot(b); }
                          if ("stop".equals(a)) removeBot(id);
                      }});
                      Listener l = listener; if (l != null) l.onAction(id, a);
                  }
              }

              private void runJs(final String js) {
                  main.post(new Runnable() { public void run() {
                      if (web == null) return;
                      if (ready) web.evaluateJavascript(js, null); else pending.add(js);
                  }});
              }

              // ----------------------------------------------------------------- bubble
              private void buildBubble(final Bot b) {
                  int idx = bots.size() - 1;
                  b.root = new LinearLayout(this);
                  b.root.setOrientation(LinearLayout.VERTICAL);
                  b.root.setGravity(Gravity.CENTER_HORIZONTAL);

                  b.bubble = new FrameLayout(this);
                  b.avatar = new ImageView(this);
                  b.avatar.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  b.avatar.setColorFilter(null);
                  b.bubble.addView(b.avatar, new FrameLayout.LayoutParams(-1, -1));
                  // bubble shows only the bot picture (no status dot)

                  b.label = new TextView(this);
                  b.label.setText(LABEL);
                  b.label.setTextColor(0xFF9AA3AF);
                  b.label.setTypeface(Typeface.MONOSPACE);
                  b.label.setGravity(Gravity.CENTER);
                  b.label.setShadowLayer(8f, 0, 0, 0xFF000000);
                  b.root.addView(b.bubble);
                  b.label.setVisibility(View.GONE);
                  b.root.addView(b.label, new LinearLayout.LayoutParams(-2, -2));

                  b.lp = new WindowManager.LayoutParams(-2, -2, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  b.lp.gravity = Gravity.TOP | Gravity.START;
                  b.lp.x = sp.getInt("bx_" + b.id, 40);
                  b.lp.y = sp.getInt("by_" + b.id, 300 + idx * dp(sizeDp + 34));

                  b.root.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy; float tx, ty; boolean moved, rebase;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          scaler.onTouchEvent(e);
                          if (scaler.isInProgress()) { moved = true; return true; }
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = b.lp.x; sy = b.lp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; rebase = false;
                                  return true;
                              case MotionEvent.ACTION_POINTER_UP:
                                  rebase = true; return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (e.getPointerCount() != 1) return true;
                                  if (rebase) { sx = b.lp.x; sy = b.lp.y; tx = e.getRawX(); ty = e.getRawY(); rebase = false; }
                                  float dx = e.getRawX() - tx, dy = e.getRawY() - ty;
                                  if (Math.abs(dx) > 12 || Math.abs(dy) > 12) moved = true;
                                  if (moved) { b.lp.x = sx + (int) dx; b.lp.y = sy + (int) dy; wm.updateViewLayout(b.root, b.lp); }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) openPanel(b, null);
                                  else sp.edit().putInt("bx_" + b.id, b.lp.x).putInt("by_" + b.id, b.lp.y).apply();
                                  return true;
                          }
                          return false;
                      }
                  });
                  applyBubbleSize(b);
              }

              private void applyBubbleSize(Bot b) {
                  int px = dp(sizeDp);
                  b.bubble.setBackground(null);
                  b.bubble.setPadding(0, 0, 0, 0);
                  b.bubble.setLayoutParams(new LinearLayout.LayoutParams(px, px));
                  b.label.setTextSize(Math.max(7f, sizeDp / 10f));
                  if (b.root.isAttachedToWindow()) wm.updateViewLayout(b.root, b.lp);
              }

              // ---------------------------------------------------------------- helpers
              private int overlayType() {
                  return Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
              }
              private float clamp(float v) { return Math.max(MIN_DP, Math.min(MAX_DP, v)); }
              private int dp(float v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              @Override
              public void onDestroy() {
              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception ignored) {}
              try { if (web != null && web.isAttachedToWindow()) wm.removeView(web); } catch (Exception ignored) {}
                  for (Bot b : bots.values()) { try { if (b.root.isAttachedToWindow()) wm.removeView(b.root); } catch (Exception ignored) {} }
                  bots.clear();
                  if (web != null) web.destroy();
                  web = null; instance = null; ready = false; expanded = false;
                  super.onDestroy();
              }
          }
          EOF
          cat > "$DIR/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends BridgeActivity {
              private static boolean asked = false;
              private String hookJs = "";

              private class TEBridge {
                  @JavascriptInterface public boolean hasPermission() { return Settings.canDrawOverlays(MainActivity.this); }

                  @JavascriptInterface public void requestPermission() {
                      runOnUiThread(new Runnable() { public void run() { openOverlaySettings(); } });
                  }

                  @JavascriptInterface public void show(String id, String name, String image) {
                      if (!Settings.canDrawOverlays(MainActivity.this)) return;
                      Intent i = new Intent(MainActivity.this, OverlayService.class);
                      i.putExtra("op", "show");
                      i.putExtra("id", id);
                      i.putExtra("name", name);
                      i.putExtra("image", image == null ? "" : image);
                      i.putExtra("title", "");
                      i.putExtra("online", true);
                      i.putExtra("open", false);
                      ContextCompat.startForegroundService(MainActivity.this, i);
                  }

